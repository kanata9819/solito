[package]
name = "solito"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
arboard = { version = "3", default-features = false }
portable-pty = "0.9.0"
winit.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
pollster = "1.0.1"
solito-renderer = { path = "../solito-renderer" }
solito-terminal = { path = "../solito-terminal" }
solito-config = { path = "../solito-config" }

[build-dependencies]
winresource = "0.1"
